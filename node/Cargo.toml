[package]
name = "aerograph-node"
description = "Aerograph sensor node: wraps the remoteid decode a $6 ESP32 runs, turns decoded Remote ID into DetectionReport JSON, and posts it to an aggregator. Also drives the labelled city-mesh simulation for the public demo."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "aerograph-node"
path = "src/main.rs"

[dependencies]
aerograph-fusion = { path = "../fusion", features = ["sim"] }
remoteid.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "2.12.1", default-features = false, features = ["json"] }
